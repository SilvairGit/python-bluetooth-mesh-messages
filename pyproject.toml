[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bluetooth-mesh-messages"
version = "1.0.2"
readme = "README.rst"
requires-python = ">=3.14,<3.15"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Michał Lowas-Rzechonek", email = "michal.lowas-rzechonek@silvair.com" },
    { name = "Amadeusz Herzog", email = "amadeusz.hercog@silvair.com" },
    { name = "Jakub Witowski", email = "jakub.witowski@silvair.com" },
    { name = "Kamil Janowski", email = "kamil.janowski@silvair.com" },
    { name = "Przemysław Fierek", email = "przemyslaw.fierek@silvair.com" },
    { name = "Rafał Gajda", email = "rafal.gajda@silvair.com" },
    { name = "Patryk Bieleń", email = "patryk.bielen@silvair.com" }
]
dependencies = [
    "construct >= 2.10.70",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
capnp = [
    "pycapnp"
]

[tool.poetry]
package-mode = true
requires-poetry = ">=2.2.1"
packages = [{ include = "bluetooth_mesh" }]

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = {extras = ["colors"], version = "^8.0.1"}
pytest = "^9.0.2"
pylint = "^4.0.5"

[tool.black]
line-length = 110
target-version = ["py314"]
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.mypy_cache
    | \.venv
    | _build
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 110
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
combine_as_imports = true

[tool.pylint]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "invalid-name",
    "fixme",
    "protected-access",
    "too-few-public-methods",
    "unused-argument",
    "too-many-lines",
    "too-many-return-statements",
    "duplicate-code",
]
enable = [
    "useless-suppression",
]
max-args = 8
max-positional-arguments = 9

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 110

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
